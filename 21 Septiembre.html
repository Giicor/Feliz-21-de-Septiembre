<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Estilo para la frase personalizada */
        .frase {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.6), 0 0 20px rgba(255, 75, 142, 0.4);
            z-index: 10;
            animation: latido 2s infinite alternate;
        }

        /* Animación suave para la frase */
        @keyframes latido {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        #btnFlorecer {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ffeb3b;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 235, 59, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 10;
        }

        #btnFlorecer:hover {
            transform: scale(1.05);
            background-color: #fdd835;
        }

        #btnFlorecer:active {
            transform: scale(0.95);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Frase agregada -->
    <div class="frase">Feliz 21 de Septiembre Mailov💝</div>
    
    <button id="btnFlorecer">🌻 ¡Hacer Florecer!</button>
    <canvas id="canvasFlores"></canvas>

    <script>
        const canvas = document.getElementById('canvasFlores');
        const ctx = canvas.getContext('2d');
        const boton = document.getElementById('btnFlorecer');

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        let flores = [];
        let animando = false;

        class Flor {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.tamanoMaximo = Math.random() * 30 + 20;
                this.tamanoActual = 0;
                this.velocidadCrecimiento = Math.random() * 0.5 + 0.5;
                this.petalos = Math.floor(Math.random() * 3) + 5;
                this.anguloRotacion = Math.random() * Math.PI;
            }

            crecer() {
                if (this.tamanoActual < this.tamanoMaximo) {
                    this.tamanoActual += this.velocidadCrecimiento;
                }
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.anguloRotacion);

                ctx.fillStyle = '#ffeb3b';
                for (let i = 0; i < this.petalos; i++) {
                    ctx.beginPath();
                    ctx.ellipse(0, -this.tamanoActual / 1.5, this.tamanoActual / 3, this.tamanoActual / 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.rotate((Math.PI * 2) / this.petalos);
                }

                ctx.beginPath();
                ctx.arc(0, 0, this.tamanoActual / 3, 0, Math.PI * 2);
                ctx.fillStyle = '#795548';
                ctx.fill();

                ctx.restore();
            }
        }

        function generarFlores() {
            for (let i = 0; i < 15; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                flores.push(new Flor(x, y));
            }
            
            if (!animando) {
                animando = true;
                animar();
            }
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            flores.forEach(flor => {
                flor.crecer();
                flor.dibujar();
            });

            requestAnimationFrame(animar);
        }

        boton.addEventListener('click', generarFlores);
    </script>
</body>
</html>
